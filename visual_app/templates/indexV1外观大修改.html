<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DbcTool 可视化转换工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            color: #e2e8f0;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 0 20px;
            border-bottom: 1px solid #334155;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
        }

        header p {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 24px;
            background: #1e293b;
            border-radius: 12px;
            padding: 4px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: #334155;
            color: #e2e8f0;
        }

        .tab-btn:hover:not(.active) {
            color: #cbd5e1;
            background: rgba(51, 65, 85, 0.5);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title .icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        .icon-convert { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
        .icon-compare { background: rgba(129, 140, 248, 0.15); color: #818cf8; }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .form-row.single {
            grid-template-columns: 1fr;
        }

        .form-row.triple {
            grid-template-columns: 1fr 1fr 1fr;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 500;
            color: #94a3b8;
        }

        .form-group input[type="text"],
        .form-group input[type="file"],
        .form-group select {
            padding: 10px 14px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #e2e8f0;
            font-size: 0.9rem;
            transition: border-color 0.2s;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #38bdf8;
        }

        .form-group input[type="file"] {
            padding: 8px 12px;
            cursor: pointer;
        }

        .form-group input[type="file"]::file-selector-button {
            background: #334155;
            border: none;
            color: #e2e8f0;
            padding: 6px 14px;
            border-radius: 6px;
            margin-right: 10px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: #cbd5e1;
            cursor: pointer;
        }

        .checkbox-item input[type="checkbox"] {
            accent-color: #38bdf8;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            color: #0f172a;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background: #334155;
            color: #e2e8f0;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .result-area {
            margin-top: 20px;
            display: none;
        }

        .result-area.show {
            display: block;
        }

        .alert {
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #4ade80;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .stat-card {
            background: #0f172a;
            border-radius: 10px;
            padding: 14px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #38bdf8;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 4px;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 12px;
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid #334155;
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .spinner.show {
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .compare-result {
            margin-top: 16px;
        }

        .diff-summary {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .diff-side {
            background: #0f172a;
            border-radius: 10px;
            padding: 16px;
        }

        .diff-side h4 {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .diff-item {
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 0.85rem;
        }

        .diff-item.added {
            background: rgba(34, 197, 94, 0.1);
            border-left: 3px solid #22c55e;
        }

        .diff-item.removed {
            background: rgba(239, 68, 68, 0.1);
            border-left: 3px solid #ef4444;
        }

        .diff-item.changed {
            background: rgba(250, 204, 21, 0.1);
            border-left: 3px solid #facc15;
        }

        .expandable {
            cursor: pointer;
            user-select: none;
        }

        .expandable .arrow {
            display: inline-block;
            transition: transform 0.2s;
            margin-right: 4px;
        }

        .expandable.expanded .arrow {
            transform: rotate(90deg);
        }

        .collapsible-body {
            display: none;
            padding-left: 20px;
            margin-top: 4px;
        }

        .collapsible-body.show {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #334155;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            border-radius: 2px;
            width: 0%;
            transition: width 0.3s;
        }

        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
            margin-right: 4px;
        }

        .tag-green { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .tag-red { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .tag-yellow { background: rgba(250, 204, 21, 0.2); color: #facc15; }

        footer {
            text-align: center;
            padding: 20px;
            color: #475569;
            font-size: 0.8rem;
            border-top: 1px solid #334155;
            margin-top: 40px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .form-row.triple {
                grid-template-columns: 1fr;
            }
            .diff-summary {
                grid-template-columns: 1fr;
            }
            .tabs {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>DbcTool 可视化转换工具</h1>
            <p>CAN 矩阵文件格式转换 &middot; DBC 对比 &middot; 编码修复</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" data-tab="convert">格式转换</button>
            <button class="tab-btn" data-tab="compare">文件对比</button>
        </div>

        <!-- 格式转换 Tab -->
        <div class="tab-content active" id="tab-convert">
            <div class="card">
                <div class="card-title">
                    <span class="icon icon-convert">&#8594;</span>
                    文件转换
                </div>

                <form id="convert-form" enctype="multipart/form-data">
                    <div class="form-row">
                        <div class="form-group">
                            <label>选择文件</label>
                            <input type="file" id="convert-file" name="file" accept=".dbc,.dbf,.kcd,.arxml,.xml,.xls,.xlsx,.json,.yaml,.yml,.sym,.ldf,.odx" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>输入格式（自动检测）</label>
                            <select id="input-format" name="input_format">
                                <option value="">自动检测</option>
                                {% for fmt in import_formats %}
                                <option value="{{ fmt.key }}">{{ fmt.label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label>输出格式</label>
                            <select id="output-format" name="output_format" required>
                                <option value="">请选择...</option>
                                {% for fmt in export_formats %}
                                <option value="{{ fmt.key }}">{{ fmt.label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="card" style="background: #162032; margin-top: 16px;">
                        <div class="card-title" style="font-size: 0.95rem;">
                            <span style="color: #818cf8;">&#9881;</span>
                            编码选项
                        </div>
                        <div class="form-row triple">
                            <div class="form-group">
                                <label>DBC 导入编码</label>
                                <select name="dbc_import_encoding">
                                    <option value="auto">自动检测</option>
                                    <option value="utf-8">UTF-8</option>
                                    <option value="gb2312">GB2312</option>
                                    <option value="iso-8859-1">ISO-8859-1</option>
                                    <option value="cp1252">CP1252</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>DBC 导出编码</label>
                                <select name="dbc_export_encoding">
                                    <option value="">使用导入编码</option>
                                    <option value="utf-8">UTF-8</option>
                                    <option value="gb2312">GB2312</option>
                                    <option value="iso-8859-1">ISO-8859-1</option>
                                    <option value="cp1252">CP1252</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>注释编码</label>
                                <select name="dbc_import_comment_encoding">
                                    <option value="auto">自动检测</option>
                                    <option value="utf-8">UTF-8</option>
                                    <option value="gb2312">GB2312</option>
                                    <option value="iso-8859-1">ISO-8859-1</option>
                                </select>
                            </div>
                        </div>
                        <div class="checkbox-group" style="margin-top: 12px;">
                            <label class="checkbox-item">
                                <input type="checkbox" name="fix_mojibake" value="true">
                                修复乱码 (Fix Mojibake)
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="dbc_unique_signal" value="true">
                                唯一信号名称
                            </label>
                        </div>
                    </div>

                    <div class="card" style="background: #162032;">
                        <div class="card-title" style="font-size: 0.95rem;">
                            <span style="color: #facc15;">&#9881;</span>
                            高级选项
                        </div>
                        <div class="form-row triple">
                            <div class="form-group">
                                <label>ARXML 版本</label>
                                <select name="arxml_version">
                                    <option value="">默认</option>
                                    <option value="3.2">AUTOSAR 3.2</option>
                                    <option value="4.0">AUTOSAR 4.0</option>
                                    <option value="4.2">AUTOSAR 4.2</option>
                                    <option value="4.3">AUTOSAR 4.3</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>XLS Motorola 位格式</label>
                                <select name="xls_motorola_format">
                                    <option value="">默认</option>
                                    <option value="msb">MSB</option>
                                    <option value="lsb">LSB</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>重新计算 DLC</label>
                                <select name="recalc_dlc">
                                    <option value="">不重新计算</option>
                                    <option value="force">强制重新计算</option>
                                    <option value="no_change">仅在需要时重新计算</option>
                                </select>
                            </div>
                        </div>
                        <div class="checkbox-group" style="margin-top: 12px;">
                            <label class="checkbox-item">
                                <input type="checkbox" name="json_canard" value="true">
                                JSON CANard 格式
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="delete_zero_signals" value="true">
                                删除零长度信号
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="ignore_pdu_container" value="true">
                                忽略 PDU Container
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="delete_obsolete_defines" value="true">
                                删除过时定义
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="delete_obsolete_ecus" value="true">
                                删除过时 ECU
                            </label>
                        </div>
                        <div class="form-row" style="margin-top: 12px;">
                            <div class="form-group">
                                <label>额外信号属性（逗号分隔）</label>
                                <input type="text" name="additional_signal_attrs" placeholder="例如: GenSigStartValue,GenSigEVName">
                            </div>
                            <div class="form-group">
                                <label>额外帧属性（逗号分隔）</label>
                                <input type="text" name="additional_frame_attrs" placeholder="例如: GenMsgSendType,GenMsgCycleTime">
                            </div>
                        </div>
                    </div>

                    <div class="btn-row">
                        <button type="submit" class="btn btn-primary" id="convert-submit">
                            <span class="spinner" id="convert-spinner"></span>
                            开始转换
                        </button>
                        <button type="button" class="btn btn-secondary" id="convert-reset">重置</button>
                    </div>
                </form>

                <div class="result-area" id="convert-result">
                    <div id="convert-message"></div>
                    <div class="stats-grid" id="convert-stats" style="display: none;"></div>
                    <div id="convert-download" style="display: none;"></div>
                </div>
            </div>
        </div>

        <!-- 文件对比 Tab -->
        <div class="tab-content" id="tab-compare">
            <div class="card">
                <div class="card-title">
                    <span class="icon icon-compare">&#8646;</span>
                    DBC 文件对比
                </div>

                <form id="compare-form" enctype="multipart/form-data">
                    <div class="form-row">
                        <div class="form-group">
                            <label>文件 1（旧版本/原始）</label>
                            <input type="file" id="compare-file1" name="file1" accept=".dbc,.dbf,.arxml,.kcd,.xml" required>
                        </div>
                        <div class="form-group">
                            <label>文件 2（新版本/修改后）</label>
                            <input type="file" id="compare-file2" name="file2" accept=".dbc,.dbf,.arxml,.kcd,.xml" required>
                        </div>
                    </div>

                    <div class="card" style="background: #162032;">
                        <div class="card-title" style="font-size: 0.95rem;">
                            <span style="color: #818cf8;">&#9881;</span>
                            对比选项
                        </div>
                        <div class="checkbox-group">
                            <label class="checkbox-item">
                                <input type="checkbox" name="check_comments" value="true" checked>
                                检查注释差异
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="check_attributes" value="true" checked>
                                检查属性差异
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="ignore_valuetables" value="true">
                                忽略值表
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="ignore_defines" value="true">
                                忽略定义
                            </label>
                        </div>
                    </div>

                    <div class="btn-row">
                        <button type="submit" class="btn btn-primary" id="compare-submit">
                            <span class="spinner" id="compare-spinner"></span>
                            开始对比
                        </button>
                        <button type="button" class="btn btn-secondary" id="compare-reset">重置</button>
                    </div>
                </form>

                <div class="result-area" id="compare-result">
                    <div id="compare-message"></div>
                    <div class="diff-summary" id="compare-summary" style="display: none;"></div>
                    <div class="compare-result" id="compare-details" style="display: none;"></div>
                </div>
            </div>
        </div>

        <footer>
            DbcTool - 基于 canmatrix 的 CAN 矩阵可视化转换工具
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Tab 切换
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    this.classList.add('active');
                    document.getElementById('tab-' + this.dataset.tab).classList.add('active');
                });
            });

            // 格式转换
            setupConvertForm();
            // 文件对比
            setupCompareForm();
        });

        function setupConvertForm() {
            const form = document.getElementById('convert-form');
            const submitBtn = document.getElementById('convert-submit');
            const spinner = document.getElementById('convert-spinner');
            const resultArea = document.getElementById('convert-result');
            const messageDiv = document.getElementById('convert-message');
            const statsDiv = document.getElementById('convert-stats');
            const downloadDiv = document.getElementById('convert-download');

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                submitBtn.disabled = true;
                spinner.classList.add('show');
                resultArea.classList.remove('show');
                messageDiv.innerHTML = '';
                statsDiv.style.display = 'none';
                downloadDiv.style.display = 'none';

                const formData = new FormData(form);

                try {
                    const resp = await fetch('/api/convert', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await resp.json();

                    if (data.success) {
                        messageDiv.innerHTML = '<div class="alert alert-success">转换成功！</div>';

                        if (data.stats) {
                            statsDiv.style.display = 'grid';
                            statsDiv.innerHTML = `
                                <div class="stat-card">
                                    <div class="stat-value">${data.stats.total_frames}</div>
                                    <div class="stat-label">消息/帧</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-value">${data.stats.total_signals}</div>
                                    <div class="stat-label">信号</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-value">${data.stats.input_format}</div>
                                    <div class="stat-label">输入格式</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-value">${data.stats.output_format.toUpperCase()}</div>
                                    <div class="stat-label">输出格式</div>
                                </div>
                            `;
                        }

                        if (data.download_url) {
                            downloadDiv.style.display = 'block';
                            downloadDiv.innerHTML = `
                                <a href="${data.download_url}" class="btn btn-primary download-btn" download>
                                    &#8615; 下载 ${data.output_name}
                                </a>
                            `;
                        }
                    } else {
                        messageDiv.innerHTML = `<div class="alert alert-error">${data.error || '转换失败'}</div>`;
                    }
                } catch (err) {
                    messageDiv.innerHTML = `<div class="alert alert-error">网络错误: ${err.message}</div>`;
                } finally {
                    submitBtn.disabled = false;
                    spinner.classList.remove('show');
                    resultArea.classList.add('show');
                }
            });

            document.getElementById('convert-reset').addEventListener('click', function() {
                form.reset();
                resultArea.classList.remove('show');
                messageDiv.innerHTML = '';
                statsDiv.style.display = 'none';
                downloadDiv.style.display = 'none';
            });
        }

        function setupCompareForm() {
            const form = document.getElementById('compare-form');
            const submitBtn = document.getElementById('compare-submit');
            const spinner = document.getElementById('compare-spinner');
            const resultArea = document.getElementById('compare-result');
            const messageDiv = document.getElementById('compare-message');
            const summaryDiv = document.getElementById('compare-summary');
            const detailsDiv = document.getElementById('compare-details');

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                submitBtn.disabled = true;
                spinner.classList.add('show');
                resultArea.classList.remove('show');
                messageDiv.innerHTML = '';
                summaryDiv.style.display = 'none';
                detailsDiv.style.display = 'none';

                const formData = new FormData(form);

                try {
                    const resp = await fetch('/api/compare', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await resp.json();

                    if (data.success) {
                        messageDiv.innerHTML = '<div class="alert alert-success">对比完成</div>';

                        if (data.stats) {
                            summaryDiv.style.display = 'grid';
                            summaryDiv.innerHTML = `
                                <div class="diff-side">
                                    <h4>${data.stats.db1_name}</h4>
                                    <p style="font-size:0.85rem;color:#94a3b8;margin-bottom:4px;">
                                        消息: ${data.stats.db1_frames} | 信号: ${data.stats.db1_signals} | ECU: ${data.stats.db1_ecus}
                                    </p>
                                </div>
                                <div class="diff-side">
                                    <h4>${data.stats.db2_name}</h4>
                                    <p style="font-size:0.85rem;color:#94a3b8;margin-bottom:4px;">
                                        消息: ${data.stats.db2_frames} | 信号: ${data.stats.db2_signals} | ECU: ${data.stats.db2_ecus}
                                    </p>
                                </div>
                            `;
                        }

                        if (data.diff_map) {
                            detailsDiv.style.display = 'block';
                            detailsDiv.innerHTML = renderDiffMap(data.diff_map);
                        }
                    } else {
                        messageDiv.innerHTML = `<div class="alert alert-error">${data.error || '对比失败'}</div>`;
                    }
                } catch (err) {
                    messageDiv.innerHTML = `<div class="alert alert-error">网络错误: ${err.message}</div>`;
                } finally {
                    submitBtn.disabled = false;
                    spinner.classList.remove('show');
                    resultArea.classList.add('show');
                }
            });

            document.getElementById('compare-reset').addEventListener('click', function() {
                form.reset();
                resultArea.classList.remove('show');
                messageDiv.innerHTML = '';
                summaryDiv.style.display = 'none';
                detailsDiv.style.display = 'none';
            });
        }

        function renderDiffMap(diffMap) {
            let html = '';
            for (const [key, entry] of Object.entries(diffMap)) {
                let statusTag = '';
                let statusClass = '';
                switch (entry.status) {
                    case 'added':
                        statusTag = '新增';
                        statusClass = 'tag-green';
                        break;
                    case 'removed':
                        statusTag = '删除';
                        statusClass = 'tag-red';
                        break;
                    case 'changed':
                        statusTag = '变更';
                        statusClass = 'tag-yellow';
                        break;
                    default:
                        statusTag = entry.status;
                        statusClass = '';
                }

                html += `<div class="diff-item ${entry.status} expandable" onclick="toggleExpand(this)">`;
                html += `<span class="arrow">&#9654;</span> `;
                html += `<span class="tag ${statusClass}">${statusTag}</span> `;
                html += `<strong>${escapeHtml(key)}</strong>`;

                if (entry.changes && entry.changes.length > 0) {
                    html += ` <span style="color:#94a3b8;font-size:0.8rem;">(${entry.changes.length} 处变更)</span>`;
                }

                html += `<div class="collapsible-body">`;
                if (entry.detail_changes && entry.detail_changes.length > 0) {
                    for (const dc of entry.detail_changes) {
                        html += `<div style="padding:4px 0;font-size:0.82rem;">`;
                        html += `<span style="color:#818cf8;">${escapeHtml(dc.label)}:</span> `;
                        html += `<span style="color:#f87171;">${escapeHtml(dc.old)}</span> `;
                        html += `&rarr; `;
                        html += `<span style="color:#4ade80;">${escapeHtml(dc.new)}</span>`;
                        html += `</div>`;
                    }
                } else if (entry.changes) {
                    for (const c of entry.changes) {
                        html += `<div style="padding:2px 0;font-size:0.82rem;color:#94a3b8;">${escapeHtml(c)}</div>`;
                    }
                }
                html += `</div>`;
                html += `</div>`;
            }

            if (!html) {
                html = '<p style="color:#94a3b8;text-align:center;padding:20px;">两个文件完全相同，没有发现差异。</p>';
            }

            return html;
        }

        function toggleExpand(el) {
            el.classList.toggle('expanded');
            const body = el.querySelector('.collapsible-body');
            if (body) {
                body.classList.toggle('show');
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
    </script>
</body>
</html>
